services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: pteronext/panel:latest
    container_name: pteronext-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - DB_DATABASE=/data/pteronext.db
      - JWT_SECRET=change-this-to-a-very-secure-random-key-in-production
    volumes:
      - pteronext-data:/data

volumes:
  pteronext-data:
    driver: local
