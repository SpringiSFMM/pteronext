<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PteroNext DNS &amp; Domain Control Center &bull; dns.pteronext.com</title>
  <link rel="icon" href="/favicon.ico?v=4" type="image/x-icon">
  <link rel="icon" href="/assets/icon-32x32.png?v=4" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/icon-16x16.png?v=4" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=4">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: #060911;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: rgba(13, 20, 36, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-subtle {
      background: rgba(11, 17, 31, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .glass-modal {
      background: rgba(10, 15, 29, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .glow-cyan {
      box-shadow: 0 0 45px -10px rgba(14, 165, 233, 0.25);
    }
    .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #080d1a; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-brand-500/30 selection:text-brand-400">
  <!-- Subtle Ambient Gradients -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-[20%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-sky-600/10 blur-[130px]"></div>
    <div class="absolute top-[40%] -right-[15%] w-[45vw] h-[45vw] rounded-full bg-indigo-600/10 blur-[140px]"></div>
    <div class="absolute -bottom-[20%] left-[20%] w-[40vw] h-[40vw] rounded-full bg-emerald-600/5 blur-[120px]"></div>
  </div>

  <div class="relative z-10 flex-1 flex flex-col">
    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-[#070b15]/85 backdrop-blur-md sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-18 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3.5">
          <div class="relative group">
            <img src="/assets/icon.png?v=3" alt="PteroNext DNS Logo" class="w-10 h-10 rounded-xl object-contain ring-2 ring-sky-500/30 shadow-lg shadow-sky-500/25 transition-transform group-hover:scale-105">
            <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 border-2 border-[#070b15] rounded-full"></span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-base font-extrabold text-white tracking-tight">dns.pteronext.com</span>
              <span class="text-[10px] font-mono font-semibold px-2 py-0.5 rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20">DNS Control</span>
            </div>
            <p class="text-[11px] text-slate-400 font-mono hidden sm:block">Automated Cloudflare DNS Provisioning &amp; Domain Security</p>
          </div>
        </div>

        <div id="navControls" class="flex items-center gap-2.5"></div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 md:p-8 space-y-7">
      <div id="viewContainer"></div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-[#05070d] py-4 text-center text-xs font-mono text-slate-500">
      <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
        <div>
          PteroNext DNS Management Relay &bull; <span class="text-slate-400">dns.pteronext.com</span> &bull; Secure Micro-Service
        </div>
        <div>
          <a href="https://panel.pteronext.com" target="_blank" class="text-sky-400 hover:text-sky-300 transition-colors">PteroNext Panel öffnen &rarr;</a>
        </div>
      </div>
    </footer>
  </div>

  <!-- Global Modal Container -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modalContent" class="w-full max-w-lg glass-modal rounded-3xl p-6 shadow-2xl relative"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>

  <script>
    let token = localStorage.getItem('pteronext_dns_token') || '';
    let domains = [];
    let stats = { active_domains: 0, revoked_domains: 0, total_domains: 0, base_domain: 'pteronext.com', cf_configured: false };
    let settings = {};
    let isConfigured = false;
    let currentUser = localStorage.getItem('pteronext_dns_user') || 'Admin';
    let activeFilter = 'all'; // all, active, revoked
    let searchQuery = '';

    function showToast(title, message, type = 'info') {
      const tc = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let borderBg = 'bg-slate-900/95 border-sky-500/40 text-sky-200';
      let icon = 'ℹ️';
      if (type === 'success') {
        borderBg = 'bg-slate-900/95 border-emerald-500/50 text-emerald-200';
        icon = '✓';
      } else if (type === 'error') {
        borderBg = 'bg-rose-950/95 border-rose-500/50 text-rose-200';
        icon = '⚠️';
      }

      toast.className = `p-4 rounded-2xl font-mono text-xs shadow-2xl border transition-all duration-300 pointer-events-auto flex items-center gap-3.5 max-w-md ${borderBg}`;
      toast.innerHTML = `
        <span class="text-base shrink-0">${icon}</span>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-white text-xs">${title}</div>
          <div class="text-[11px] text-slate-300 mt-0.5 break-words">${message}</div>
        </div>
      `;
      tc.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 4500);
    }

    async function api(url, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      if (token) {
        headers['Authorization'] = 'Bearer ' + token;
      }
      try {
        const resp = await fetch(url, { ...options, headers });
        if (resp.status === 401) {
          if (token) {
            token = '';
            localStorage.removeItem('pteronext_dns_token');
            showToast('Sitzung abgelaufen', 'Bitte erneut anmelden.', 'error');
            render();
          }
          return { error: 'Nicht autorisiert' };
        }
        return await resp.json();
      } catch (err) {
        return { error: err.message || 'Netzwerkfehler' };
      }
    }

    function renderNav() {
      const el = document.getElementById('navControls');
      if (token) {
        el.innerHTML = `
          <div class="flex items-center gap-2 sm:gap-3">
            <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-mono">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>${currentUser}</span>
            </div>
            <button onclick="open2FAModal()" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-sky-400 hover:text-sky-300 text-xs font-mono border border-slate-700/80 transition-all flex items-center gap-1.5">
              <span>🛡️</span>
              <span class="hidden sm:inline">2FA Schutz</span>
            </button>
            <button onclick="openSettingsModal()" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 text-xs font-mono border border-slate-700/80 transition-all flex items-center gap-1.5">
              <span>⚙️</span>
              <span class="hidden sm:inline">Einstellungen</span>
            </button>
            <button onclick="openPasswordModal()" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 text-xs font-mono border border-slate-700/80 transition-all flex items-center gap-1.5">
              <span>🔑</span>
              <span class="hidden sm:inline">Passwort</span>
            </button>
            <button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/25 text-rose-300 hover:text-rose-200 text-xs font-mono border border-rose-500/25 transition-all">
              Abmelden
            </button>
          </div>
        `;
      } else {
        el.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xs font-mono text-amber-400 bg-amber-500/10 px-3 py-1.5 rounded-full border border-amber-500/20 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
              Geschützter Bereich
            </span>
          </div>
        `;
      }
    }

    function render() {
      renderNav();
      const vc = document.getElementById('viewContainer');

      if (!token) {
        // High-end Secure Login View with Custom Homepage Banner
        vc.innerHTML = `
          <div class="max-w-md mx-auto mt-6 rounded-3xl glass-card glow-cyan overflow-hidden shadow-2xl">
            <!-- Hero Banner Image -->
            <div class="relative h-44 w-full overflow-hidden border-b border-slate-800">
              <img src="/assets/banner.jpg?v=2" alt="PteroNext DNS Network" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-t from-[#060911] via-[#060911]/40 to-transparent"></div>
              <div class="absolute bottom-3 left-4 right-4 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                  <img src="/assets/icon.png?v=3" alt="Logo" class="w-9 h-9 rounded-xl object-contain ring-2 ring-sky-400/50 shadow-md">
                  <div>
                    <h2 class="text-sm font-extrabold text-white tracking-tight">DNS Control Center</h2>
                    <p class="text-[10px] font-mono text-sky-300">dns.pteronext.com</p>
                  </div>
                </div>
                <span class="text-[10px] font-mono px-2 py-0.5 rounded-md bg-sky-500/20 text-sky-300 border border-sky-500/30">v2.0</span>
              </div>
            </div>

            <div class="p-6 sm:p-7 space-y-5">
              <p class="text-xs text-slate-400 leading-relaxed">
                Melde dich mit deinen Administrator-Zugangsdaten an, um Subdomains zu verwalten, Missbrauch zu moderieren und Cloudflare-Automationen zu prüfen.
              </p>

              <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-mono text-slate-400 mb-1.5">Benutzername</label>
                  <input id="loginUser" type="text" placeholder="Admin-Benutzername" autocomplete="username" class="w-full bg-[#080d19] border border-slate-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all" required>
                </div>
                <div>
                  <label class="block text-xs font-mono text-slate-400 mb-1.5">Passwort</label>
                  <div class="relative">
                    <input id="loginPass" type="password" placeholder="Passwort eingeben" autocomplete="current-password" class="w-full bg-[#080d19] border border-slate-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all pr-10" required>
                    <button type="button" onclick="togglePassVisibility('loginPass')" class="absolute right-3 top-3 text-slate-400 hover:text-white text-xs">👁️</button>
                  </div>
                </div>
                <div id="twoFactorField" class="hidden transition-all duration-300">
                  <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-mono text-sky-400 flex items-center gap-1.5 font-bold">
                      <span>🛡️</span>
                      <span>2FA Sicherheitscode (TOTP)</span>
                    </label>
                    <span class="text-[10px] font-mono text-slate-500">6 Ziffern</span>
                  </div>
                  <input id="login2FACode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="z. B. 123456" autocomplete="one-time-code" class="w-full bg-[#080d19] border border-sky-500/50 rounded-xl px-4 py-3 text-sm text-sky-300 font-mono tracking-widest text-center focus:border-sky-400 focus:ring-2 focus:ring-sky-500/30 outline-none transition-all">
                  <p class="text-[11px] text-slate-400 mt-1.5">Authenticator-Code aus Google Authenticator oder Apple Passwords eingeben.</p>
                </div>
                <button id="loginSubmitBtn" type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-600 via-sky-500 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-mono text-xs font-bold transition-all shadow-lg shadow-sky-600/30 active:scale-[0.98] flex items-center justify-center gap-2">
                  <span id="loginBtnText">Anmelden &rarr;</span>
                </button>
              </form>

              <div class="pt-2 border-t border-slate-800/80 text-center">
                <span class="text-[11px] text-slate-500 font-mono">
                  Sitzungen kryptografisch gesichert &bull; Rate Limiting aktiv
                </span>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Filtered domains
      const filtered = domains.filter(d => {
        if (activeFilter === 'active' && d.status !== 'active') return false;
        if (activeFilter === 'revoked' && d.status !== 'revoked') return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchSub = (d.subdomain || '').toLowerCase().includes(q);
          const matchFull = (d.full_domain || '').toLowerCase().includes(q);
          const matchIp = (d.target_ip || '').toLowerCase().includes(q);
          const matchServer = (d.server_name || '').toLowerCase().includes(q) || (d.server_uuid || '').toLowerCase().includes(q);
          if (!matchSub && !matchFull && !matchIp && !matchServer) return false;
        }
        return true;
      });

      const activeCount = domains.filter(d => d.status === 'active').length;
      const revokedCount = domains.filter(d => d.status === 'revoked').length;

      vc.innerHTML = `
        <!-- Custom Homepage Hero Banner -->
        <div class="relative w-full rounded-3xl overflow-hidden glass-card border border-slate-800 shadow-xl mb-6">
          <div class="h-44 sm:h-52 w-full relative">
            <img src="/assets/banner.jpg?v=2" alt="PteroNext Network" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-[#060911] via-[#060911]/60 to-transparent"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-[#060911]/80 via-transparent to-transparent"></div>
            
            <div class="absolute bottom-5 left-5 right-5 flex flex-col sm:flex-row sm:items-end justify-between gap-3">
              <div class="flex items-center gap-4">
                <img src="/assets/icon.png?v=3" alt="Icon" class="w-14 h-14 rounded-2xl object-contain ring-2 ring-sky-400/40 shadow-xl shadow-sky-500/20">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-xl sm:text-2xl font-black text-white tracking-tight">PteroNext Domain Management</span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-sky-500/20 text-sky-300 border border-sky-500/30">ONLINE</span>
                  </div>
                  <p class="text-xs text-slate-300 font-mono mt-0.5">Automatisches A- &amp; SRV-Record Routing &bull; Cloudflare Edge Protection &bull; dns.pteronext.com</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <a href="https://panel.pteronext.com" target="_blank" class="px-4 py-2 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 text-sky-300 border border-sky-500/30 text-xs font-mono font-semibold transition-all">
                  Panel öffnen &rarr;
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Top Metrics Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
          <div class="glass-card rounded-2xl p-5 relative overflow-hidden group">
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-emerald-500/70 to-transparent"></div>
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono text-slate-400 uppercase tracking-wider">Aktive DNS Domains</span>
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
            </div>
            <div class="text-3xl font-extrabold text-white font-mono tracking-tight mt-2 flex items-baseline gap-2">
              <span>${activeCount}</span>
              <span class="text-xs font-normal text-emerald-400">online</span>
            </div>
            <p class="text-[11px] text-slate-500 font-mono mt-1">A &amp; SRV Cloudflare Live-Records</p>
          </div>

          <div class="glass-card rounded-2xl p-5 relative overflow-hidden group">
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-rose-500/70 to-transparent"></div>
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono text-slate-400 uppercase tracking-wider">Widerrufen / Moderiert</span>
              <span class="text-rose-400 text-sm">⛔</span>
            </div>
            <div class="text-3xl font-extrabold text-rose-400 font-mono tracking-tight mt-2 flex items-baseline gap-2">
              <span>${revokedCount}</span>
              <span class="text-xs font-normal text-slate-500">gelöscht</span>
            </div>
            <p class="text-[11px] text-slate-500 font-mono mt-1">Aus DNS &amp; Panel entfernt</p>
          </div>

          <div class="glass-card rounded-2xl p-5 relative overflow-hidden group">
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-sky-500/70 to-transparent"></div>
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono text-slate-400 uppercase tracking-wider">Basis-Domain</span>
              <span class="text-sky-400 text-sm">🌐</span>
            </div>
            <div class="text-2xl font-extrabold text-sky-400 font-mono tracking-tight mt-2 truncate" title="${stats.base_domain || 'pteronext.com'}">
              ${stats.base_domain || 'pteronext.com'}
            </div>
            <p class="text-[11px] text-slate-500 font-mono mt-1">Standard Suffix für alle Server</p>
          </div>

          <div class="glass-card rounded-2xl p-5 relative overflow-hidden group cursor-pointer" onclick="openSettingsModal()">
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-indigo-500/70 to-transparent"></div>
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono text-slate-400 uppercase tracking-wider">Cloudflare Zone</span>
              <span class="text-indigo-400 text-sm">⚡</span>
            </div>
            <div class="text-xl font-bold font-mono tracking-tight mt-2 flex items-center gap-2">
              ${stats.cf_configured 
                ? '<span class="text-emerald-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>Verbunden</span>' 
                : '<span class="text-amber-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-400"></span>Token fehlt</span>'}
            </div>
            <p class="text-[11px] text-slate-500 font-mono mt-1 flex items-center justify-between">
              <span>API Status prüfen</span>
              <span class="text-sky-400">&rarr;</span>
            </p>
          </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="glass-card rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="setFilter('all')" class="px-3.5 py-1.5 rounded-xl text-xs font-mono transition-all ${activeFilter === 'all' ? 'bg-sky-500 text-white font-bold shadow-md shadow-sky-500/25' : 'bg-slate-800/80 hover:bg-slate-700/80 text-slate-300'}">
              Alle (${domains.length})
            </button>
            <button onclick="setFilter('active')" class="px-3.5 py-1.5 rounded-xl text-xs font-mono transition-all ${activeFilter === 'active' ? 'bg-emerald-500 text-white font-bold shadow-md shadow-emerald-500/25' : 'bg-slate-800/80 hover:bg-slate-700/80 text-slate-300'}">
              Aktiv (${activeCount})
            </button>
            <button onclick="setFilter('revoked')" class="px-3.5 py-1.5 rounded-xl text-xs font-mono transition-all ${activeFilter === 'revoked' ? 'bg-rose-500 text-white font-bold shadow-md shadow-rose-500/25' : 'bg-slate-800/80 hover:bg-slate-700/80 text-slate-300'}">
              Widerrufen (${revokedCount})
            </button>
          </div>

          <div class="flex items-center gap-2.5 flex-1 max-w-md">
            <div class="relative flex-1">
              <input 
                id="tableSearch" 
                type="text" 
                value="${searchQuery}" 
                oninput="handleSearch(this.value)" 
                placeholder="Subdomain, Server, UUID oder IP suchen..." 
                class="w-full bg-[#080d19] border border-slate-800 focus:border-sky-500 rounded-xl px-3.5 py-2 text-xs font-mono text-white outline-none pl-8"
              >
              <span class="absolute left-2.5 top-2.5 text-xs text-slate-500">🔍</span>
            </div>
            <button onclick="loadData()" title="Daten neu laden" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 border border-slate-700 transition-all">
              ↻
            </button>
          </div>
        </div>

        <!-- Domains Table Card -->
        <div class="glass-card rounded-2xl p-4 sm:p-6 space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
            <div>
              <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono">Registrierte Subdomains</h3>

    async function submitRevocation(id, fullDomain) {
      const reasonEl = document.getElementById('revokeReasonInput');
      const reason = reasonEl ? reasonEl.value.trim() : '';
      if (!reason) {
        showToast('Fehlende Angabe', 'Bitte einen Grund für den Widerruf angeben.', 'error');
        return;
      }

      const btn = document.getElementById('confirmRevokeBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'Wird gelöscht...';
      }

      const res = await api('/admin/api/domains/revoke', {
        method: 'POST',
        body: JSON.stringify({ domain_id: id, reason })
      });

      closeModal();

      if (res.success) {
        showToast('Erfolgreich gelöscht', res.message, 'success');
        await loadData();
      } else {
        showToast('Fehler beim Löschen', res.error || 'Aktion fehlgeschlagen', 'error');
      }
    }

      const conf = document.getElementById('pwdConfirm').value;

      if (nw !== conf) {
        showToast('Passwort-Fehler', 'Die neuen Passwörter stimmen nicht überein.', 'error');
        return;
      }

      const res = await api('/admin/api/password', {
        method: 'POST',
        body: JSON.stringify({ current_password: cur, new_password: nw })
      });

      if (res.success) {
        closeModal();
        showToast('Passwort geändert', 'Das neue Passwort ist sofort gültig.', 'success');

    function generateNewDNSApiKey() {
      const chars = 'abcdef0123456789';
      let rand = '';
      for (let i = 0; i < 32; i++) {
        rand += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      const newKey = 'ptd_' + rand;
      const el = document.getElementById('cfgDnsApiKey');
      if (el) {
        el.value = newKey;
        showToast('Neuer Key generiert', 'Klicke auf "Speichern", um den Key zu aktivieren.', 'info');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;
      const tfField = document.getElementById('twoFactorField');
      const tfCode = document.getElementById('login2FACode') ? document.getElementById('login2FACode').value.trim() : '';
      const btn = document.getElementById('loginSubmitBtn');
      const btnText = document.getElementById('loginBtnText');

      if (btn) btn.disabled = true;

      const payload = { username: u, password: p };
      if (tfCode) {
        payload.two_factor_code = tfCode;
      }

      const res = await api('/admin/api/login', {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      if (btn) btn.disabled = false;

      if (res.requires_2fa) {
        if (tfField) {
          tfField.classList.remove('hidden');
          const codeInput = document.getElementById('login2FACode');
          if (codeInput) codeInput.focus();
        }
        if (btnText) btnText.innerHTML = 'Verifizieren &amp; Anmelden &rarr;';
        showToast('2FA erforderlich', res.message || 'Bitte 6-stelligen Authenticator-Code eingeben', 'info');
        return;
      }

      if (res.success && res.token) {
        token = res.token;
        currentUser = res.username || u;
        localStorage.setItem('pteronext_dns_token', token);
        localStorage.setItem('pteronext_dns_user', currentUser);
        showToast('Willkommen', 'Erfolgreich am DNS Control Center angemeldet.', 'success');
        await loadData();
      } else {
        showToast('Login fehlgeschlagen', res.error || 'Ungültige Anmeldedaten', 'error');
      }
    }

            </div>

            <div class="space-y-3 pt-1">
              <p class="text-xs text-slate-300">
                1. Scanne diesen QR-Code mit deiner Authenticator App oder gib den Schlüssel manuell ein:
              </p>

              <div class="flex flex-col sm:flex-row items-center gap-4 p-4 rounded-2xl bg-slate-900/90 border border-slate-800">
                <div class="p-2 bg-white rounded-xl shadow-lg shrink-0">
                  <img src="${qrUrl}" alt="2FA QR Code" class="w-36 h-36">
                </div>
                <div class="flex-1 space-y-2 text-left w-full">
                  <div class="text-[11px] text-slate-400">Manueller Sicherheitsschlüssel:</div>
                  <div class="p-2.5 bg-[#060911] border border-slate-700/80 rounded-xl font-mono text-xs text-sky-300 break-all select-all flex items-center justify-between gap-2">
                    <span id="secretKeyDisplay">${setup.secret}</span>
                    <button type="button" onclick="copyText('${setup.secret}')" class="text-slate-400 hover:text-white px-1.5 py-0.5 rounded bg-slate-800 text-[10px]">Kopieren</button>
                  </div>
                  <div class="text-[10px] text-slate-500">Typ: RFC 6238 TOTP (30s, 6 Ziffern, SHA1)</div>
                </div>
              </div>

              <form onsubmit="handleEnable2FA(event)" class="space-y-3 pt-2">
                <div>
                  <label class="block text-xs text-slate-400 mb-1">2. 6-stelligen Bestätigungscode aus der App eingeben:</label>
                  <input id="twoFaVerifyCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456" class="w-full bg-[#080d19] border border-sky-500/60 focus:border-sky-400 rounded-xl px-4 py-2.5 text-base text-center tracking-widest text-white outline-none font-bold" required autofocus>
                </div>

                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800">
                  <button onclick="closeModal()" type="button" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs">
                    Abbrechen
                  </button>
                  <button type="submit" class="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-sky-600 hover:from-emerald-500 hover:to-sky-500 text-white text-xs font-bold shadow-lg shadow-emerald-600/30">
                    2FA Jetzt Aktivieren &rarr;
                  </button>
                </div>
              </form>
            </div>
          </div>
        `);
      }
    }

    async function handleEnable2FA(e) {
      e.preventDefault();
      const code = document.getElementById('twoFaVerifyCode').value.trim();
      const res = await api('/admin/api/2fa/enable', {
        method: 'POST',
        body: JSON.stringify({ code })
      });

      if (res.success) {
        closeModal();
        showToast('2FA Aktiviert! 🎉', 'Zwei-Faktor-Authentifizierung ist ab sofort aktiv.', 'success');
      } else {
        showToast('2FA Fehler', res.error || 'Ungültiger Sicherheitscode', 'error');
      }
    }

    async function handleDisable2FA(e) {
      e.preventDefault();
      const password = document.getElementById('twoFaDisablePass').value;
      const res = await api('/admin/api/2fa/disable', {
        method: 'POST',
        body: JSON.stringify({ password })
      });

      if (res.success) {
        closeModal();
        showToast('2FA Deaktiviert', 'Zwei-Faktor-Authentifizierung wurde ausgeschaltet.', 'info');
      } else {
        showToast('Fehler', res.error || 'Konnte 2FA nicht deaktivieren', 'error');
      }
    }

    async function logout() {
      await api('/admin/api/logout', { method: 'POST' });
      token = '';
      localStorage.removeItem('pteronext_dns_token');
      localStorage.removeItem('pteronext_dns_user');
      showToast('Abgemeldet', 'Sitzung beendet.', 'info');
      render();
    }

    async function loadData() {
      if (!token) return render();
      try {
        const [domRes, cfgRes, statsRes] = await Promise.all([
          api('/admin/api/domains'),
          api('/admin/api/settings'),
          api('/admin/api/stats')
        ]);
        domains = domRes.data || [];
        settings = cfgRes.settings || {};
        isConfigured = Boolean(cfgRes.token_configured);
        if (statsRes && !statsRes.error) {
          stats = statsRes;
        }
      } catch (e) {
        console.error(e);
      }
      render();
    }

    loadData();
  </script>
</body>
</html>
