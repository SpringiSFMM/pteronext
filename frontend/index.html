<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>PteroNext — Modern Game & Application Server Management</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('pteronext_theme');
          if (stored) {
            document.documentElement.setAttribute('data-theme', stored);
            document.documentElement.classList.add('theme-' + stored);
          } else {
            fetch('/api/theme/global')
              .then(function(r) { return r.json(); })
              .then(function(data) {
                if (data && data.global_theme) {
                  document.documentElement.setAttribute('data-theme', data.global_theme);
                  document.documentElement.classList.add('theme-' + data.global_theme);
                }
              })
              .catch(function() {});
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0d1117] text-[#f0f6fc] min-h-screen antialiased selection:bg-slate-700 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
